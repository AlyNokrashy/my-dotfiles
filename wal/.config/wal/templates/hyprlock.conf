
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.1, 0.25, 1

    animation = fadeIn, 1, 6, smooth
    animation = fadeOut, 1, 6, smooth
    animation = inputFieldDots, 1, 3, smooth
}

# Background blur
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
}

# Soft overlay (makes text readable)
shape {
    monitor =
    size = 100%, 100%
    color = rgba(35,33,54,0.45)

    position = 0,0
    halign = center
    valign = center
}

shadow {
    monitor =
    range = 20
    render_power = 3
    color = rgba(62,143,176,0.3)
}

# CLOCK
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = $font
    color = rgb(224,222,244)

    position = 0, 220
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A • %d %B %Y"
    font_size = 28
    font_family = $font
    color = rgb(156,207,216)

    position = 0, 140
    halign = center
    valign = center
}

# PASSWORD FIELD
input-field {
    monitor =
    size = 260, 55

    outline_thickness = 2
    rounding = 12

    inner_color = rgba(42,39,63,0.7)
    outer_color = rgba(62,143,176,0.9)

    check_color = rgba(156,207,216,0.9)
    fail_color = rgba(235,111,146,0.9)

    font_color = rgb(224,222,244)
    font_family = $font

    placeholder_text = Enter Password

    dots_spacing = 0.35
    fade_on_empty = false

    position = 0, -40
    halign = center
    valign = center
}

# KEYBOARD LAYOUT INDICATOR
label {
    monitor =
    text = $LAYOUT
    font_size = 18
    font_family = $font
    color = rgb(110,106,134)

    onclick = hyprctl switchxkblayout all next

    position = 0, -120
    halign = center
    valign = center
}
