# ==============================================================================
# Includes

[include]
files = ["keybinds.toml"]

[include.optional]
files = ["noctalia.toml"]

# ==============================================================================
# General
# Optional session examples. XWayland support is enabled by default.
# https://docs.noctalia.dev/umbriel/configuration/#general
#
[general]
show_cheatsheet = false
autostart = [
  "/usr/lib/gvfsd",
  "udiskie",
  "bash -c 'eval $(ssh-agent) && ssh-add ~/.ssh/id_ed25519'",
  "noctalia",
]
xwayland = true
# Disable this workaround if it causes stuttering or frame drops.
nvidia_sync_workaround = false
# Modal dialogs hang on their parent window and follow it. Turn this off to keep them ordinary windows.
attach_modal_dialogs = true

# ==============================================================================
# Environment
#
[environment]
__GLX_VENDOR_LIBRARY_NAME = "nvidia"
__VK_LAYER_NV_optimus = "NVIDIA_only"
LIBVA_DRIVER_NAME = "nvidia"
MOZ_ENABLE_WAYLAND = "1"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
CLUTTER_BACKEND = "wayland"
QT_QPA_PLATFORM = "wayland;xcb"
QT_QPA_PLATFORMTHEME = "qt6ct"
QT_AUTO_SCREEN_SCALE_FACTOR = "1"
XCURSOR_THEME = "BreezeX-RosePine-Linux"
XCURSOR_SIZE = "24"

# ==============================================================================
# Lid events
# Remove the laptop panel from the desktop while the lid is closed, then
# restore it when the lid opens. Replace eDP-1 with the name from
# `umbriel outputs`.
# https://docs.noctalia.dev/umbriel/configuration/#events
#
# [events]
# lid_close = "umbriel msg output-disable eDP-1"
# lid_open = "umbriel msg output-enable eDP-1"

# ==============================================================================
# Screencast
# By default, the first target-changing action during an active share asks for
# confirmation. Disable that protection only if immediate keybind changes are
# preferred.
# https://docs.noctalia.dev/umbriel/configuration/#screencast
#
# [screencast]
# disable_dynamic_confirmation = true

# ==============================================================================
# Outputs
# https://docs.noctalia.dev/umbriel/outputs/
[output.HDMI-A-1]
mode = "1920x1080@240"
position = [0, 0]
scale = 1.0
focus_at_startup = true
workspaces = ["1", "2", "3"]

[output.eDP-1]
mode = "1920x1080@144"
position = [1920, 0]
scale = 1.0
# Only this panel advertises adaptive sync; HDMI-A-1 reports none.
# "fullscreen" keeps it off on the desktop and on while a fullscreen window
# (game, video) is on the workspace. Use "always" for smooth scrolling too.
vrr = "fullscreen"
workspaces = ["4", "5", "6", "7"]

# ==============================================================================
# Appearance
# https://docs.noctalia.dev/umbriel/appearance/
#
[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 0

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 5
noise = 0.02
brightness = 0.8
contrast = 0.9
saturation = 1.1

# ==============================================================================
# Effects
# Every effect is off until a preset is selected; border and window effects
# scale with overview zoom. Include a bundled preset (adjust /usr for the
# package prefix), then select it by name.
# https://docs.noctalia.dev/umbriel/effects/
#
# [include]
# files = ["/usr/share/umbriel/effects/border/pulse/effect.toml"]
# For a cursor tail, include /usr/share/umbriel/effects/cursor/trail/effect.toml
# and set cursor = "trail" in [effects].
# For audio-reactive borders, include /usr/share/umbriel/effects/border/audio/effect.toml
# and set border = "audio" in [effects].
# Enable Noctalia's Umbriel audio provider in its shell settings, or supply an
# external effect-audio v2 producer with 64 spectrum bands. Umbriel does not capture audio.
# Pools accept matching presets defined/included separately. This one-member
# example uses the bundled pulse preset; add other border names to choose.
#
# [effects.pool.borders]
# kind = "border"
# choose = ["pulse"]
# selection = "unused_first" # or round_robin, random
# Select with border = "borders" in your [effects] table.
# Add to your existing [keybinds] table:
# "Mod+Shift+E" = "effect-border-cycle borders"
# "Mod+Ctrl+E" = "effect-border-toggle"
# "Mod+Alt+E" = "effect-border-reset"
#
# [effects]
# border = "pulse"
# Draw the border on every decorated, non-urgent, non-fullscreen window, not
# just the focused one (overview cards included).
# border_unfocused = true
# For a screen effect only while an output is shared (a portal screen share or a
# screenshot), include /usr/share/umbriel/effects/screen/vignette/effect.toml and
# set screen_cast = "vignette" in [effects]; add in_capture = true for viewers to see it.

# ==============================================================================
# Input

# Keyboard layout, repeat, and NumLock from Hyprland's modules/input.lua.
#
[input.keyboard]
layout = "us,ara"
options = "grp:alt_shift_toggle"
repeat_rate = 50
repeat_delay = 300
numlock_toggle = true

# Hyprland's global input:sensitivity applied to the pointer.
#
[input.mouse]
sensitivity = -0.3

[input.touchpad]
natural_scroll = true
# sensitivity = -0.3   # Hyprland's global sensitivity also applied to the touchpad

# Hyprland cursor:no_hardware_cursors, plus the XCursor theme/size from env.lua.
#
[input.cursor]
hardware_cursor = false
theme = "BreezeX-RosePine-Linux"
size = 24

# Focus can follow the pointer across tiled, floating, and pinned windows.
#
[input.focus]
follows_mouse = true
# hover_raises = false # Hover focuses only; clicks and keybinds raise.

# Confine touch input to one display.
#
# [input.touch]
# enabled = true
# map_to_output = "eDP-1"

