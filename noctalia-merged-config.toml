# =============================================================================
# Noctalia config snapshot — merged user config (includes GUI settings)
# =============================================================================
# Generated with:   noctalia config export merged
# Source stack:     ~/.config/noctalia/*.toml  +  ~/.local/state/noctalia/settings.toml
#
# This captures the GUI-managed settings that live in the state dir and are NOT
# part of the stow package. It sits at the repo ROOT on purpose: it is not a
# stow package and not under ~/.config/noctalia, so Noctalia will NOT load it
# and it cannot conflict with your live config or the split *.toml files.
#
# ---- Regenerate after changing settings in the Noctalia GUI ------------------
#   cd ~/dotfiles
#   noctalia config export merged \
#     | sed -E 's/^([[:space:]]*)(password|api_key)([[:space:]]*=[[:space:]]*)"[^"]*"/\1\2\3"CHANGEME"/' \
#     > noctalia-merged-config.toml
#
# ---- SECRETS ----------------------------------------------------------------
# password / api_key values are redacted to "CHANGEME". The real values remain
# only in ~/.local/state/noctalia/settings.toml on the machine.
#
# Last exported: 2026-10-16
# =============================================================================

