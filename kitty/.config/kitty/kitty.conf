# THEME POINTER
# include theme.conf
# include ~/.cache/wal/colors-kitty.conf
include Catppuccin-Mocha.conf
# include Gruvbox Material Dark Medium.conf

allow_remote_control yes
listen_on unix:/tmp/kitty.sock

font_family Maple Mono NF
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto
disable_ligatures never

url_style curly

# Make the cursor shape a beam
cursor_shape block
shell_integration no-cursor

shell zsh

# performance settings
sync_to_monitor no

# perf
repaint_delay 8
input_delay 3

cursor_trail 10
cursor_trail_decay 0.01 0.6
cursor_trail_start_threshold 0

# Padding
# window_padding_width 7
# window_padding_height 7


scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_handle_opacity 0
scrollbar_track_hover_opacity 0

scrollback_lines 10000

# Just a keybind to change font size to your liking, it's CTRL + scroll wheel up or down.
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# mapping tab/window movement with vim motions
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map alt+b move_window
map alt+f move_window_forward
map alt+w new_window
map alt+q close_window

map alt+shift+t new_tab
map alt+shift+h previous_tab
map alt+shift+l next_tab


# Background opacity, set to 0 if you want blur/transparency.
background_opacity 0.75

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten '/home/aly/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'

# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim

# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output

# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
include themes/noctalia.conf


