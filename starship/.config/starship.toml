palette = "noctalia"
add_newline = false

format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold #AC82E9"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "#7b91fc"

[git_status]
style = "#f3fc7b"

[cmd_duration]
min_time = 2000
style = "#fc92fc"
format = "took [$duration]($style) "
disabled = true

[character]
success_symbol = "[❯](bold #AC82E9)"
error_symbol = "[❯](bold #AC82E9)"

