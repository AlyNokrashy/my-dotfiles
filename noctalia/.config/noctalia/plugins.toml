[plugins]
# Fully-qualified ids ("<author>/<plugin>") that are active.
enabled = ["noctalia/screen_recorder","gustav0ar/drive-health" , "yuuto/arch-updater", "cleboost/librelinkup", "dotnetrob/cat", "kv7499/asus-fan", "noctalia/wallhaven"]
