[keybinds]
validate = ["return", "kp_enter", "ctrl+y"]
cancel   = ["escape"]
left     = ["left"]
right    = ["right"]
up       = ["up", "ctrl+p"]
down     = ["down", "ctrl+n"]
tab_next = ["tab"]
tab_previous = ["shift+tab", "iso_left_tab"]
copy     = ["ctrl+c"]
save     = ["ctrl+s"]
delete   = ["del"]
