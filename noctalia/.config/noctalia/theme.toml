[theme]
mode = "auto"
shell_mode = "auto"

    [theme.templates]
    builtin_ids = [ "hyprland", "cava", "btop", "gtk3", "gtk4", "qt", "kitty", "starship" ]
    community_ids = ["steam", "opencode", "zen-browser", "obsidian", "fastfetch", "zathura", "papirus-icons", "lazygit", "yazi"]
    enable_builtin_templates = true
    enable_community_templates = true

        [theme.templates.user.obsidian_extra]
        input_path = "/home/aly/.config/noctalia/Obsidian/obsidian.css"
        output_path = "/home/aly/Documents/Obsidian/My Vault/.obsidian/snippets/noctalia.css"

        [theme.templates.user.leaf]
        input_path_modes = { dark = "/home/aly/.config/leaf/noctalia-dark.toml.template", light = "/home/aly/.config/leaf/noctalia-light.toml.template" }
        output_path = "/home/aly/.config/leaf/noctalia.toml"
[wallpaper]
directory = "/home/aly/Pictures/Wallpapers/"
